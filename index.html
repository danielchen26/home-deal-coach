<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0e0d">
<title>选房谈判助手 · HomeDeal Coach</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
/* ============ Design tokens ============ */
:root{
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --bg:#f3f5f2;
  --bg-glow-1:rgba(13,148,126,.07);
  --bg-glow-2:rgba(59,130,246,.05);
  --surface:#ffffff;
  --surface-2:#f7f9f7;
  --surface-3:#eef1ee;
  --ink:#15201b;
  --ink-2:#57635d;
  --ink-3:#8b968f;
  --line:rgba(21,32,27,.09);
  --line-strong:rgba(21,32,27,.16);
  --brand:#0d8a76;
  --brand-strong:#0a6f5f;
  --brand-ink:#0b5f52;
  --brand-soft:rgba(13,138,118,.10);
  --brand-soft-2:rgba(13,138,118,.16);
  --ok:#1a8a4f; --ok-soft:rgba(26,138,79,.12);
  --warn:#a3690b; --warn-soft:rgba(163,105,11,.12);
  --danger:#c13f3f; --danger-soft:rgba(193,63,63,.11);
  --shadow-sm:0 1px 2px rgba(21,32,27,.05);
  --shadow-md:0 2px 6px rgba(21,32,27,.05),0 12px 32px -16px rgba(21,32,27,.22);
  --shadow-lg:0 24px 64px -24px rgba(21,32,27,.35);
  --r-sm:10px; --r-md:14px; --r-lg:18px; --r-xl:24px;
  --dock-bg:rgba(255,255,255,.82);
}
html[data-theme="dark"]{
  --bg:#0a0e0d;
  --bg-glow-1:rgba(45,212,191,.05);
  --bg-glow-2:rgba(59,130,246,.04);
  --surface:#12171510;
  --surface:#131917;
  --surface-2:#181f1c;
  --surface-3:#1f2724;
  --ink:#e9efeb;
  --ink-2:#a3b0a9;
  --ink-3:#6d7a73;
  --line:rgba(233,239,235,.08);
  --line-strong:rgba(233,239,235,.16);
  --brand:#2fbfa4;
  --brand-strong:#25a88b;
  --brand-ink:#7ee0c8;
  --brand-soft:rgba(47,191,164,.12);
  --brand-soft-2:rgba(47,191,164,.20);
  --ok:#4ade80; --ok-soft:rgba(74,222,128,.13);
  --warn:#fbbf24; --warn-soft:rgba(251,191,36,.12);
  --danger:#f87171; --danger-soft:rgba(248,113,113,.12);
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow-md:0 2px 6px rgba(0,0,0,.35),0 16px 40px -20px rgba(0,0,0,.6);
  --shadow-lg:0 28px 72px -28px rgba(0,0,0,.8);
  --dock-bg:rgba(19,25,23,.82);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  font-family:var(--font);background:var(--bg);color:var(--ink);
  line-height:1.55;font-size:14px;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(600px 400px at 12% -4%,var(--bg-glow-1),transparent 60%),
                   radial-gradient(700px 500px at 95% 0%,var(--bg-glow-2),transparent 55%);
  background-attachment:fixed;
  min-height:100vh;
}
::selection{background:var(--brand-soft-2)}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
button{font-family:inherit}

/* ============ Layout ============ */
.app{display:flex;min-height:100vh}
.side{
  display:none;position:sticky;top:0;height:100vh;width:228px;flex:0 0 228px;
  padding:20px 14px;border-right:1px solid var(--line);
  flex-direction:column;gap:4px;
}
@media(min-width:920px){ .side{display:flex} }
.side .logo{display:flex;align-items:center;gap:10px;padding:6px 10px 18px}
.side .logo .mark{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--brand),var(--brand-strong));display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:var(--shadow-sm)}
.side .logo .t1{font-weight:700;font-size:14.5px;letter-spacing:.2px}
.side .logo .t2{font-size:10.5px;color:var(--ink-3);letter-spacing:.08em;text-transform:uppercase}
.nav-item{
  display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--r-sm);
  border:none;background:none;color:var(--ink-2);font-size:13.5px;font-weight:550;
  cursor:pointer;width:100%;text-align:left;transition:all .15s ease;position:relative;
}
.nav-item svg{width:17px;height:17px;flex:0 0 17px;opacity:.85}
.nav-item:hover{background:var(--surface-2);color:var(--ink)}
.nav-item.on{background:var(--brand-soft);color:var(--brand-ink);font-weight:650}
html[data-theme="dark"] .nav-item.on{color:var(--brand-ink)}
.side .grow{flex:1}
.side .foot{padding:10px 12px;font-size:11px;color:var(--ink-3);line-height:1.6;border-top:1px solid var(--line)}
.main-wrap{flex:1;min-width:0;display:flex;flex-direction:column}
main{flex:1;width:100%;max-width:980px;margin:0 auto;padding:20px 18px 110px}
@media(min-width:920px){ main{padding:34px 36px 60px} }

/* topbar (mobile) */
.topbar{
  position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:10px;
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
  background:var(--dock-bg);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line);
}
@media(min-width:920px){ .topbar{display:none} }
.topbar .mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--brand),var(--brand-strong));display:flex;align-items:center;justify-content:center;color:#fff}
.topbar .t{font-weight:700;font-size:15px;flex:1}
.topbar .t small{display:block;font-size:10px;color:var(--ink-3);font-weight:500;letter-spacing:.06em}

/* dock (mobile) */
.dock{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(14px + env(safe-area-inset-bottom));z-index:60;
  display:flex;gap:2px;padding:5px;border-radius:20px;
  background:var(--dock-bg);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid var(--line-strong);box-shadow:var(--shadow-lg);
}
@media(min-width:920px){ .dock{display:none} }
.dock button{
  border:none;background:none;color:var(--ink-3);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:2px;
  font-size:10px;font-weight:600;padding:7px 15px;border-radius:15px;transition:all .15s ease;
  min-width:66px;
}
.dock button svg{width:20px;height:20px}
.dock button.on{background:var(--brand);color:#fff;box-shadow:var(--shadow-sm)}

/* ============ Primitives ============ */
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:22px}
.page-head h1{font-size:24px;font-weight:750;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
@media(min-width:920px){ .page-head h1{font-size:28px} }
.page-head .sub{font-size:12.5px;color:var(--ink-3);margin-top:3px}
h2.sec{
  font-size:13px;font-weight:650;color:var(--ink-2);
  margin:28px 0 12px;display:flex;align-items:center;gap:8px;
  text-transform:uppercase;letter-spacing:.07em;
}
h2.sec:first-child{margin-top:0}
h2.sec .n{font-size:11px;color:var(--ink-3);font-weight:500;text-transform:none;letter-spacing:0}
h2.sec svg{width:15px;height:15px;color:var(--brand)}
.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:var(--shadow-sm);padding:18px;transition:box-shadow .2s ease,transform .15s ease;
}
.card.hoverable:hover{box-shadow:var(--shadow-md);transform:translateY(-2px)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:1fr}
@media(min-width:760px){.g2{grid-template-columns:1fr 1fr}}
.g3{grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
.btn{
  display:inline-flex;align-items:center;gap:7px;justify-content:center;
  background:var(--brand);color:#fff;border:none;border-radius:var(--r-sm);
  padding:9px 16px;font-size:13px;font-weight:600;cursor:pointer;
  transition:all .15s ease;box-shadow:var(--shadow-sm);
}
.btn svg{width:15px;height:15px}
.btn:hover{background:var(--brand-strong);transform:translateY(-1px);box-shadow:var(--shadow-md)}
.btn:active{transform:translateY(0)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line-strong);box-shadow:none}
.btn.ghost:hover{background:var(--surface-2);border-color:var(--ink-3)}
.btn.soft{background:var(--brand-soft);color:var(--brand-ink);box-shadow:none}
html[data-theme="dark"] .btn.soft{color:var(--brand-ink)}
.btn.soft:hover{background:var(--brand-soft-2)}
.btn.danger{background:none;color:var(--danger);border:1px solid transparent;box-shadow:none}
.btn.danger:hover{background:var(--danger-soft);border-color:var(--danger-soft)}
.btn.mini{padding:5px 10px;font-size:12px;border-radius:8px}
.btn.mini svg{width:13px;height:13px}
.btn.block{width:100%}
.icon-btn{
  border:none;background:none;color:var(--ink-3);cursor:pointer;padding:7px;border-radius:9px;
  display:inline-flex;transition:all .15s ease;
}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.icon-btn svg{width:17px;height:17px}
input,select,textarea{
  font-family:inherit;font-size:13.5px;color:var(--ink);
  background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);
  padding:9px 11px;width:100%;transition:border-color .15s ease,box-shadow .15s ease;
}
html[data-theme="dark"] input,html[data-theme="dark"] select,html[data-theme="dark"] textarea{background:var(--surface-3)}
input::placeholder,textarea::placeholder{color:var(--ink-3)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
label.f{display:block;font-size:11.5px;color:var(--ink-2);margin-bottom:5px;font-weight:600;letter-spacing:.02em}
.field{margin-bottom:10px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.row>*{flex:1;min-width:128px}
.pill{
  display:inline-flex;align-items:center;gap:5px;font-size:11px;padding:3px 10px;
  border-radius:99px;font-weight:650;white-space:nowrap;letter-spacing:.02em;
}
.pill svg{width:11px;height:11px}
.pill.dd{background:var(--warn-soft);color:var(--warn)}
.pill.live{background:var(--ok-soft);color:var(--ok)}
.pill.off{background:var(--surface-3);color:var(--ink-3)}
.pill.offer{background:var(--brand-soft);color:var(--brand-ink)}
html[data-theme="dark"] .pill.offer{color:var(--brand-ink)}
.pill.deal{background:var(--brand);color:#fff}
.pill.flag{background:var(--danger-soft);color:var(--danger)}
.pill.plain{background:var(--surface-2);color:var(--ink-2);font-weight:550}
.flex{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.muted{color:var(--ink-3);font-size:12px}
.mt{margin-top:12px}.mb{margin-bottom:12px}
.note{font-size:12px;color:var(--ink-3);margin-top:10px;line-height:1.65}
.note b{color:var(--ink-2)}
.callout{border-radius:var(--r-md);padding:11px 13px;font-size:12.5px;line-height:1.6;margin-top:10px;display:flex;gap:9px}
.callout svg{width:15px;height:15px;flex:0 0 15px;margin-top:2px}
.callout.warn{background:var(--warn-soft);color:var(--warn)}
.callout.info{background:var(--brand-soft);color:var(--brand-ink)}
html[data-theme="dark"] .callout.info{color:var(--brand-ink)}
.empty{text-align:center;padding:52px 16px;color:var(--ink-3)}
.empty svg{width:44px;height:44px;margin-bottom:12px;opacity:.4}
.empty .t{font-size:14.5px;font-weight:600;color:var(--ink-2);margin-bottom:4px}
code.k{background:var(--surface-3);border-radius:6px;padding:1px 7px;font-size:11.5px;font-variant-numeric:tabular-nums}

/* ============ Tables ============ */
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{
  font-size:10.5px;color:var(--ink-3);text-align:left;font-weight:650;
  padding:8px 8px;border-bottom:1px solid var(--line-strong);
  white-space:nowrap;text-transform:uppercase;letter-spacing:.06em;
}
table.t td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t tr:last-child td{border-bottom:none}
table.t td.num,table.t th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.t input{padding:6px 9px;font-size:12.5px;background:transparent;border-color:transparent}
table.t input:hover{border-color:var(--line-strong)}
table.t input:focus{background:var(--surface-2)}
.cbar{width:64px;height:5px;border-radius:99px;background:var(--surface-3);overflow:hidden;margin-left:8px;display:inline-block;vertical-align:middle}
.cbar i{display:block;height:100%;background:var(--brand);border-radius:99px}
.cbar.hot i{background:var(--ok)}
.fbtn{width:32px;height:26px;border-radius:7px;border:1px solid var(--line);background:var(--surface);font-size:12px;font-weight:650;color:var(--ink-3);cursor:pointer;transition:all .12s ease;font-variant-numeric:tabular-nums}
.fbtn:hover{border-color:var(--ink-3)}
.fbtn.on.v2{background:var(--ok);color:#fff;border-color:var(--ok)}
.fbtn.on.v1{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.fbtn.on.v0{background:var(--surface-3);color:var(--ink-2);border-color:var(--line-strong)}
.fbtn.on.vm1{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
.fbtn.on.vm2{background:var(--danger);color:#fff;border-color:var(--danger)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(10px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;font-size:13px;font-weight:600;box-shadow:var(--shadow-lg);opacity:0;transition:all .25s ease;z-index:200;max-width:86vw;text-align:center;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ============ Board ============ */
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:14px 16px;box-shadow:var(--shadow-sm)}
.stat .lbl{font-size:11px;color:var(--ink-3);font-weight:600;letter-spacing:.05em;text-transform:uppercase;margin-bottom:3px;display:flex;align-items:center;gap:6px}
.stat .lbl svg{width:13px;height:13px}
.stat .val{font-size:23px;font-weight:750;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat .val small{font-size:12px;color:var(--ink-3);font-weight:500}
.pcard{cursor:pointer;position:relative;overflow:hidden;display:flex;flex-direction:column}
.pcard:hover{box-shadow:var(--shadow-md);transform:translateY(-2px)}
.pcard .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.pcard .name{font-size:15px;font-weight:700;letter-spacing:-.01em;line-height:1.35}
.pcard .addr{font-size:12px;color:var(--ink-3);margin-top:2px}
.pcard .priceline{display:flex;align-items:baseline;gap:9px;margin:13px 0 4px;flex-wrap:wrap}
.pcard .price{font-size:23px;font-weight:750;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.pcard .was{font-size:12.5px;color:var(--ink-3);text-decoration:line-through}
.pcard .spark{margin:6px -4px 10px}
.pcard .stats{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.pcard .stat-chip{font-size:11.5px;color:var(--ink-2);background:var(--surface-2);border-radius:8px;padding:3px 9px;font-variant-numeric:tabular-nums;display:inline-flex;align-items:center;gap:5px}
.pcard .stat-chip svg{width:12px;height:12px;flex:0 0 12px;opacity:.75}
.pcard .stat-chip b{font-weight:650;color:var(--ink)}
.pcard .foot{display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px solid var(--line);padding-top:12px;margin-top:auto}
.progress{height:5px;background:var(--surface-3);border-radius:99px;overflow:hidden;flex:1;min-width:70px}
.progress i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .3s ease}

/* ============ Sheet(居中弹窗) ============ */
.overlay{position:fixed;inset:0;z-index:100;background:rgba(8,12,10,.5);display:flex;backdrop-filter:blur(3px);padding:20px 14px;overflow-y:auto}
.sheet{
  background:var(--bg);width:100%;max-width:800px;margin:auto;
  border-radius:var(--r-lg);border:1px solid var(--line);
  box-shadow:var(--shadow-lg);padding:16px 18px 60px;
  animation:popIn .2s cubic-bezier(.32,.72,.24,1);
}
@keyframes popIn{from{transform:scale(.975) translateY(8px);opacity:0}to{transform:none;opacity:1}}
@media(max-width:640px){
  .overlay{padding:0}
  .sheet{border-radius:0;border:none;min-height:100dvh;padding:12px 14px 70px}
}
.sheet .shead{position:sticky;top:0;background:var(--bg);padding:8px 0 14px;z-index:5;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);margin-bottom:8px}
.sheet .shead h3{font-size:17.5px;font-weight:750;letter-spacing:-.01em;flex:1;line-height:1.3}
.tier-opener td{background:var(--brand-soft)}
.check-item{display:flex;gap:11px;align-items:flex-start;padding:11px 4px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .12s ease;border-radius:8px}
.check-item:hover{background:var(--surface-2)}
.check-item:last-child{border-bottom:none}
.check-item .box{
  flex:0 0 19px;height:19px;border-radius:6px;border:1.5px solid var(--line-strong);margin-top:1px;
  display:flex;align-items:center;justify-content:center;color:#fff;background:var(--surface);transition:all .15s ease;
}
.check-item .box svg{width:11px;height:11px;opacity:0}
.check-item[data-st="ok"] .box{background:var(--ok);border-color:var(--ok)}
.check-item[data-st="ok"] .box svg{opacity:1}
.check-item[data-st="ok"] .txt{color:var(--ink-2)}
.check-item[data-st="flag"] .box{background:var(--danger);border-color:var(--danger)}
.check-item[data-st="flag"] .box svg{opacity:1}
.check-item .txt{font-size:13px;font-weight:550}
.check-item .sub{font-size:11.5px;color:var(--ink-3);margin-top:1px;line-height:1.55}
.check-item[data-st="flag"] .txt{color:var(--danger)}

/* ============ Playbook ============ */
.play{counter-reset:rule;display:grid;gap:0}
.play .rule{display:flex;gap:13px;padding:13px 2px;border-bottom:1px solid var(--line)}
.play .rule:last-child{border-bottom:none}
.play .rule::before{
  counter-increment:rule;content:counter(rule,decimal-leading-zero);
  flex:0 0 32px;height:32px;border-radius:10px;background:var(--brand-soft);color:var(--brand-ink);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;font-variant-numeric:tabular-nums;
}
html[data-theme="dark"] .play .rule::before{color:var(--brand-ink)}
.play .rule .rt{font-weight:650;font-size:13.5px;margin-bottom:2px;letter-spacing:-.01em}
.play .rule .rd{font-size:12.5px;color:var(--ink-2);line-height:1.65}
.flow{display:flex;flex-direction:column;gap:0}
.flow .step{display:flex;align-items:center;gap:12px;padding:10px 2px}
.flow .step .dot{flex:0 0 26px;height:26px;border-radius:99px;background:var(--surface-3);display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;color:var(--ink-2);font-variant-numeric:tabular-nums}
.flow .step:not(:last-child)::after{content:'';position:absolute}
.flow .connector{width:1.5px;height:10px;background:var(--line-strong);margin-left:12.75px}

/* ============ Calculator ============ */
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:3px;gap:2px}
.seg button{
  flex:1;border:none;background:none;padding:7px 10px;border-radius:8px;font-size:12.5px;font-weight:600;
  color:var(--ink-2);cursor:pointer;transition:all .15s ease;white-space:nowrap;
}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-sm)}
html[data-theme="dark"] .seg button.on{background:var(--surface-3)}
.calc-hero{
  border-radius:var(--r-lg);padding:18px;margin-top:14px;
  background:linear-gradient(150deg,var(--brand-soft-2),var(--brand-soft) 55%,transparent 140%);
  border:1px solid var(--brand-soft-2);
}
html[data-theme="dark"] .calc-hero{border:1px solid rgba(47,191,164,.25)}
.calc-hero .lbl{font-size:11px;color:var(--brand-ink);opacity:.75;font-weight:650;letter-spacing:.05em;text-transform:uppercase}
html[data-theme="dark"] .calc-hero .lbl{color:var(--brand-ink)}

const IC = { // 线性图标

/* ---------------- 主题 ---------------- */
const THEME_KEY='hdc-theme';
function applyTheme(t){
  document.documentElement.dataset.theme=t;
  const lbl = t==='dark'?'浅色模式':'深色模式';
  const s=$('#themeLabel-side'); if(s) s.textContent=lbl;
  const top=$('#themeBtn-top'); if(top) top.innerHTML = t==='dark'?IC.sun:IC.moon;
  const side=$('#themeBtn-side');
  if(side) side.querySelector('svg').outerHTML = t==='dark'?IC.sun:IC.moon;
  const mt=document.querySelector('meta[name=theme-color]'); if(mt) mt.content = t==='dark'?'#0a0e0d':'#f3f5f2';
}
let theme = localStorage.getItem(THEME_KEY) || (matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
applyTheme(theme);
function toggleTheme(){ theme = theme==='dark'?'light':'dark'; localStorage.setItem(THEME_KEY,theme); applyTheme(theme); }
$('#themeBtn-side').addEventListener('click',e=>{ if(e.target.closest('.nav-item')&&!e.target.closest('#themeBtn-side'))return; toggleTheme(); });
$('#themeBtn-top').addEventListener('click',toggleTheme);

/* ---------------- 计算 ---------------- */
function pmt(principal, annualRatePct, years){ // 等额本息月供
  const r = annualRatePct/100/12, n = years*12;
  if(principal<=0) return 0;
  if(r<=0) return principal/n;
  const f = Math.pow(1+r,n);
  return principal*r*f/(f-1);
}
/* 临时性 buydown:第 k 年按 (票面利率-当年补贴点数) 全期重算月供(规划近似) */
function buydownSchedule(loan, noteRate, years, type){
  const offsets = {'none':[], '2-1':[2,1], '3-2-1':[3,2,1]}[type] || [];
  const base = pmt(loan, noteRate, years);
  const years_ = [];
  let fund = 0;
  const show = Math.max(3, offsets.length + 1);
  for(let y=1; y<=show; y++){
    const off = offsets[y-1] || 0;
    const pay = off>0 ? pmt(loan, Math.max(0.0001, noteRate-off), years) : base;
    if(off>0) fund += (base-pay)*12;
    years_.push({year:y, rate:noteRate-off, pi:pay, subsidized:off>0});
  }
  return {base, years:years_, fund};
}
function concession(listPrice, offer, creditPct){
  const credit = offer*creditPct/100;
  const sellerNet = offer-credit;
  return {credit, sellerNet, pct:(listPrice-sellerNet)/listPrice*100};
}
/* 挂牌价格走势迷你图(步进折线) */
function spark(hist, w, h, uid){
  const pts = hist.filter(x=>x.price && x.date).slice().sort((a,b)=>a.date<b.date?-1:1);
  if(pts.length<2) return '';
  const pad=6, ph=14;
  const xs = pts.map((p,i)=> pts.length===1 ? w/2 : pad + i*(w-2*pad)/(pts.length-1));
  const prices = pts.map(p=>p.price);
  const lo = Math.min(...prices), hi = Math.max(...prices);
  const ys = prices.map(v => hi===lo ? h/2 : pad + (hi-v)*(h-2*pad)/(hi-lo));
  let d = `M ${xs[0].toFixed(1)} ${ys[0].toFixed(1)}`;
  for(let i=1;i<pts.length;i++) d += ` L ${xs[i].toFixed(1)} ${ys[i-1].toFixed(1)} L ${xs[i].toFixed(1)} ${ys[i].toFixed(1)}`;
  const area = d + ` L ${xs[xs.length-1].toFixed(1)} ${h-pad} L ${xs[0].toFixed(1)} ${h-pad} Z`;
  const dots = pts.map((p,i)=>`<circle cx="${xs[i].toFixed(1)}" cy="${ys[i].toFixed(1)}" r="${i===pts.length-1?3.4:2.6}" fill="var(--brand)" stroke="var(--surface)" stroke-width="1.5"/>`).join('');

function factorInfo(p){
  const f = (p.factors && p.factors.length===FACTORS.length) ? p.factors : zeroFactors();
  const sum = f.reduce((a,x)=>a+((x&&x.s)||0),0);
  const band = sum>=6?['支撑强','ok']:sum>=2?['中性偏正','offer']:sum>=-1?['中性','plain']:['支撑弱','flag'];
  const [sc,st,su,de] = [f[0].s,f[1].s,f[3].s,f[4].s];
  let advice;
  if(su<0||de<0){
    const weak=[]; if(su<0)weak.push('退出时与同楼盘/同区在售库存直接竞争'); if(de<0)weak.push('当前买方热度不足');

  return {f, sum, band, advice};

/* 退出情景:按起报价与持有年限,三种年化假设下的净回笼与持有成本 */
function exitScenarios(p){
  const t = p.tiers && p.tiers[0];
  if(!t || !t.price || !p.rate) return null;
  const hold = p.holdYears || 3;
  const P=t.price, d=(p.downPct??10)/100, L=P*(1-d);
  const r=p.rate/100/12, m=(p.term||30)*12, n=Math.round(hold*12);
  const bal = L*((Math.pow(1+r,m)-Math.pow(1+r,n))/(Math.pow(1+r,m)-1));
  const pi = pmt(L,p.rate,p.term||30);
  const down = P*d;
  const rows = [-0.02,0,0.02].map(g=>{
    const sale = P*Math.pow(1+g,hold);
    const net = sale*0.94 - bal;               // 扣 6% 卖房成本后净回笼
    const paid = down + pi*n;
    return {g, sale, net, cost: paid-net, month:(paid-net)/n};
  });
  return {rows, pi, bal, down, hold, price:P};
}

/* ---------------- 链接/地址解析(看板万能输入) ---------------- */
function humanizeTokens(raw){
  const toks = String(raw).split(/[-_]+/).filter(Boolean);
  const zipIdx = toks.findIndex(t=>/^\d{5}$/.test(t));
  let zip=null, state=null, core=toks.slice();
  if(zipIdx>-1){
    zip = toks[zipIdx];
    if(zipIdx>0 && /^[A-Za-z]{2}$/.test(toks[zipIdx-1])){ state = toks[zipIdx-1].toUpperCase(); core = toks.slice(0,zipIdx-1); }
    else core = toks.slice(0,zipIdx);
  } else if(core.length>1 && /^[A-Za-z]{2}$/.test(core[core.length-1])){
    state = core.pop().toUpperCase();
  }
  core = core.map(t=>/^\d/.test(t) ? t : t.charAt(0).toUpperCase()+t.slice(1).toLowerCase());
  let s = core.join(' ');
  if(state) s += `, ${state}`;
  if(zip) s += ` ${zip}`;
  return s;
}
function parseListingInput(str){
  const um = str.match(/https?:\/\/[^\s]+/i);
  if(!um) return {addr:str.trim(), url:null, platform:null};
  const url = um[0];
  try{
    const u = new URL(url);
    const seg = u.pathname.split('/').filter(Boolean).map(s=>decodeURIComponent(s));
    const platform = /redfin\./.test(u.host)?'Redfin' : /zillow\./.test(u.host)?'Zillow' : /realtor\./.test(u.host)?'Realtor.com' : '网页';
    const notAddr = s => ['homedetails','apartments','b','for_sale','for-rent','rental','building','condos','new-construction'].includes(s)
      || /_zpid$/.test(s)
      || /^-?\d+(?:\.\d+)?,-?\d+(?:\.\d+)?_ll$/.test(s)   // 经纬度段
      || /^\d{4,}$/.test(s);                               // 纯 id 段
    let addr='';
    if(platform==='Redfin' && seg.length>=3){
      const zipM = seg[2].match(/-(\d{5})$/);
      const street = humanizeTokens(zipM ? seg[2].slice(0,-6) : seg[2]);
      addr = street + ', ' + humanizeTokens(seg[1]) + ', ' + seg[0].toUpperCase() + (zipM ? ' ' + zipM[1] : '');
    } else if(platform==='Zillow'){
      const hd = seg.find(s=>!notAddr(s));
      addr = hd ? humanizeTokens(hd) : '';
    } else if(platform==='Realtor.com' && seg.length>=2){
      addr = humanizeTokens(seg[1].replace(/_M\d+.*$/,''));
    }
    // 兜底:解析结果太短(如孤立的 "b")时,退回原始输入
    if(!addr || addr.replace(/[^A-Za-z0-9]/g,'').length < 5) addr = str.trim().replace(/https?:\/\/\S+/ig,'').trim() || str.trim();
    return {addr, url, platform};
  }catch(e){ return {addr:str.trim(), url, platform:null}; }
}

function propMetrics(p){
  const m = {firstDate:null, firstPrice:null, curRoundDate:null, cuts:0, totalCutsPct:null, dom:null, roundDom:null, relist:false};
  const listed = p.history.filter(h=>/挂牌/.test(h.label)&&h.price);
  if(listed.length){
    m.firstDate = listed[0].date; m.firstPrice = listed[0].price;
    const last = listed[listed.length-1];
    m.curRoundDate = last.date;
    if(listed.length>1) m.relist = true;
    m.dom = daysBetween(m.firstDate, todayStr());
    m.roundDom = daysBetween(m.curRoundDate, todayStr());
  }
  m.cuts = p.history.filter(h=>/降价/.test(h.label)).length;
  if(m.firstPrice && p.listPrice) m.totalCutsPct = (m.firstPrice-p.listPrice)/m.firstPrice*100;
  return m;
}

    <div class="stat"><div class="lbl" style="${flags?'color:var(--danger)':''}">${IC.alert}待处理警示</div><div class="val" style="${flags?'color:var(--danger)':''}">${flags}<small> 项</small></div></div>
  </div>`;
  const cards = db.properties.map((p,i)=>{
    const m = propMetrics(p);
    const st = STATUSES[p.status]||STATUSES[0];
    const t1 = p.tiers?.[0];
    const c1 = t1&&t1.price ? concession(p.listPrice, t1.price, t1.creditPct) : null;
    const done = Object.values(p.checklist||{}).filter(v=>v==='ok').length;
    const pflags = Object.values(p.checklist||{}).filter(v=>v==='flag').length;
    const total = CHECKLIST.length;
    return `<div class="card hoverable pcard" onclick="openProp('${p.id}')">
      <div class="top">
        <div style="min-width:0">
          <div class="name">${esc(p.name)}</div>
          <div class="addr">${esc(p.addr||'')}</div>
        </div>
        <span class="pill ${st[1]}">${st[0]}</span>
      </div>
      <div class="priceline">
        <span class="price">${usd(p.listPrice)}</span>
        ${m.firstPrice&&m.firstPrice!==p.listPrice?`<span class="was">${usd(m.firstPrice)}</span><span class="pill dd">${pct1(-m.totalCutsPct)}</span>`:''}
        ${p.seed?'<span class="pill plain">示例</span>':''}
      </div>
      <div class="spark">${spark(p.history,320,56,i)}</div>
      <div class="stats">
        ${m.dom!=null?`<span class="stat-chip">${IC.clock} 首挂至今 <b>${m.dom}天</b>${m.relist?' · <b style="color:var(--warn)">重挂</b>':''}</span>`:''}
        ${m.cuts?`<span class="stat-chip">降价 <b>${m.cuts}次</b></span>`:''}
        ${p.holdYears!=null?`<span class="stat-chip">${IC.target} 持有 <b>${fmtHold(p.holdYears)}</b>·${holdType(p.holdYears)}</span>`:`<span class="stat-chip" style="color:var(--warn)">${IC.target} 未设持有计划</span>`}
        ${(()=>{const s=(p.factors||[]).reduce((a,x)=>a+((x&&x.s)||0),0);return `<span class="stat-chip">${IC.gauge} 支撑 <b style="color:${s>=2?'var(--ok)':(s<=-2?'var(--danger)':'var(--ink)')}">${s>0?'+':''}${s}</b></span>`;})()}
        ${p.srcUrl && !p.listPrice?`<span class="stat-chip" style="color:var(--warn)">${IC.alert} 数据待充填</span>`:''}
        ${c1?`<span class="stat-chip">起报让步 <b style="color:var(--ok)">${pct1(-c1.pct)}</b></span>`:''}
      </div>
      <div class="foot">
        <div class="flex" style="flex:1;min-width:140px">
          <div class="progress"><i style="width:${done/total*100}%"></i></div>
          <span class="muted num">尽调 ${done}/${total}${pflags?` · <span style="color:var(--danger);font-weight:650">⚠${pflags}</span>`:''}</span>
        </div>
        <button class="icon-btn" title="删除" onclick="event.stopPropagation();delProp('${p.id}')">${IC.trash}</button>
      </div>
    </div>`;
  }).join('');
  el.innerHTML = `
    <div class="page-head">
      <div><h1>房源看板</h1><div class="sub">挂牌历史 · 重挂检测 · 谈判阶梯 · 尽调进度</div></div>
    </div>
    <div class="card mb" style="padding:12px 14px">
      <div class="flex" style="flex-wrap:nowrap;gap:8px">
        <input id="qaInput" placeholder="粘贴 Redfin / Zillow / Realtor 链接,或任意地址 —— 回车建档" style="flex:1;min-width:0" onkeydown="if(event.key==='Enter')quickAdd()">
        <button class="btn" onclick="quickAdd()" style="flex:0 0 auto">${IC.plus} 建档</button>
      </div>
      <div class="note" style="margin-top:6px">建档后需充填数据(书签充填器 / 粘贴解析 / 服务端 / AI),再点详情页右上打印机图标生成报告。</div>
    </div>
    <div class="flex" style="justify-content:flex-end;margin-bottom:14px">
      <button class="btn ghost" onclick="newProp()">${IC.plus} 手动新增</button>
    </div>
    ${statRow}
    <div class="grid g3">${cards}</div>`;
}

/* ---------------- 详情抽屉 ---------------- */
function openProp(id){ renderSheet(id); $('#overlay').style.display='flex'; }
function closeProp(){ $('#overlay').style.display='none'; }
$('#overlay').addEventListener('click', e=>{ if(e.target.id==='overlay') closeProp(); });

function newProp(prefill={}){
  const p = {
    id:'p'+Date.now(), name:prefill.name||'新房源', addr:prefill.addr||'', srcUrl:prefill.srcUrl||null, status:0, holdYears:null, factors:zeroFactors(),
    listPrice:null, hoaMonthly:null, taxAnnual:null, insMonthly:null, pmiMonthly:0,
    downPct:20, rate:6.75, term:30, notes:'',
    history:[], tiers:[{label:'偏强硬起报价',price:null,creditPct:3},{label:'第一档调整',price:null,creditPct:3},{label:'重新评估上限',price:null,creditPct:3}],
    comps:[], checklist:{}
  };
  db.properties.unshift(p); save(); openProp(p.id);
}
function delProp(id){
  const p = getProp(id); if(!p) return;
  if(!confirm(`删除「${p.name}」?此操作不可撤销。`)) return;
  db.properties = db.properties.filter(x=>x.id!==id); save(); closeProp();
}

function setPath(o, path, v){
  const parts = path.split('.');
  while(parts.length>1) o = o[parts.shift()];
  o[parts[0]] = v;
}
function bindSheet(p){
  const handler = key => e => {
    const v = e.target.type==='number' ? (e.target.value===''?null:parseFloat(e.target.value)) : e.target.value;
    setPath(p, e.target.dataset[key], v); save(); renderSheet(p.id);
  };
  $$('#sheet [data-f]').forEach(el=>el.addEventListener('change', handler('f')));
  $$('#sheet select[data-s]').forEach(el=>el.addEventListener('change', e=>{ p[e.target.dataset.s]=parseInt(e.target.value); save(); renderSheet(p.id); }));
  $$('#sheet [data-h]').forEach(el=>el.addEventListener('change', handler('h')));
  $$('#sheet [data-t]').forEach(el=>el.addEventListener('change', handler('t')));
  $$('#sheet [data-c]').forEach(el=>el.addEventListener('change', handler('c')));
  $$('#sheet [data-x]').forEach(el=>el.addEventListener('change', handler('x')));
}
function setFactor(id,i,s){
  const p = getProp(id); if(!p) return;
  if(!p.factors || p.factors.length!==FACTORS.length) p.factors = zeroFactors();
  p.factors[i].s = s; save(); renderSheet(id);
}

function renderSheet(id){
  const p = getProp(id); if(!p) return;
  const m = propMetrics(p);
  const st = STATUSES[p.status]||STATUSES[0];
  const histRows = p.history.map((h,i)=>`<tr>
      <td style="width:136px"><input type="date" value="${h.date||''}" data-h="history.${i}.date"></td>
      <td><input type="text" value="${esc(h.label)}" list="evlist" placeholder="挂牌/降价/撤牌…" data-h="history.${i}.label"></td>
      <td style="width:142px" class="num"><input type="number" inputmode="decimal" value="${h.price??''}" placeholder="$" data-h="history.${i}.price"></td>
      <td style="width:40px"><button class="icon-btn" onclick="rmRow('${p.id}','history',${i})" title="删除">${IC.x}</button></td>
    </tr>`).join('');
  const tierRows = p.tiers.map((t,i)=>{
    const c = (t.price&&p.listPrice) ? concession(p.listPrice,t.price,t.creditPct) : null;
    const barW = c? Math.min(100, Math.abs(c.pct)/15*100) : 0;
    return `<tr class="${i===0?'tier-opener':''}">
      <td><input type="text" value="${esc(t.label)}" data-t="tiers.${i}.label" placeholder="档位说明"></td>
      <td style="width:122px" class="num"><input type="number" inputmode="decimal" value="${t.price??''}" placeholder="$" data-t="tiers.${i}.price"></td>
      <td style="width:66px" class="num"><input type="number" inputmode="decimal" step="0.5" value="${t.creditPct??3}" data-t="tiers.${i}.creditPct"></td>
      <td class="num">${c?usd(c.credit):'—'}</td>
      <td class="num">${c?usd(c.sellerNet):'—'}</td>
      <td class="num"><b style="font-weight:700;color:${c&&c.pct<0?'var(--danger)':'inherit'}">${c?pct1(-c.pct):'—'}</b><span class="cbar ${c&&c.pct>9?'hot':''}"><i style="width:${barW}%"></i></span></td>
      <td style="width:40px"><button class="icon-btn" onclick="rmRow('${p.id}','tiers',${i})" title="删除">${IC.x}</button></td>
    </tr>`;
  }).join('');
  const compRows = p.comps.map((c,i)=>`<tr>
      <td><input type="text" value="${esc(c.addr)}" placeholder="地址" data-c="comps.${i}.addr"></td>
      <td style="width:122px" class="num"><input type="number" inputmode="decimal" value="${c.price??''}" placeholder="$" data-c="comps.${i}.price"></td>
      <td style="width:112px"><input type="month" value="${c.date||''}" data-c="comps.${i}.date"></td>
      <td style="width:52px" class="num"><input type="number" inputmode="decimal" value="${c.beds??''}" placeholder="卧" data-c="comps.${i}.beds"></td>
      <td style="width:80px" class="num"><input type="number" inputmode="decimal" value="${c.sqft??''}" placeholder="sqft" data-c="comps.${i}.sqft"></td>
      <td class="num">${(c.price&&c.sqft)?'$'+Math.round(c.price/c.sqft):'—'}</td>
      <td><input type="text" value="${esc(c.note||'')}" placeholder="备注" data-c="comps.${i}.note"></td>
      <td style="width:40px"><button class="icon-btn" onclick="rmRow('${p.id}','comps',${i})" title="删除">${IC.x}</button></td>
    </tr>`).join('');
  const checkItems = CHECKLIST.map((c,i)=>{
    const stt = (p.checklist||{})[i]||'';
    return `<div class="check-item" data-st="${stt}" onclick="cycleCheck('${p.id}',${i})" title="点击切换:待办 → ✓确认 → ⚠有问题">
      <div class="box">${IC.check}</div>
      <div><div class="txt">${esc(c[0])}</div><div class="sub">${esc(c[1])}</div></div>
    </div>`;
  }).join('');
  const done = Object.values(p.checklist||{}).filter(v=>v==='ok').length;

  $('#sheet').innerHTML = `
    <div class="shead">
      <h3>${esc(p.name)}${p.srcUrl?` <a class="pill plain" href="${esc(p.srcUrl)}" target="_blank" rel="noopener" style="text-decoration:none">来源↗</a>`:''}</h3>
      <select data-s="status" style="width:auto;font-weight:600">${STATUSES.map((s,i)=>`<option value="${i}" ${p.status===i?'selected':''}>${s[0]}</option>`).join('')}</select>
      <button class="icon-btn" onclick="genReport('${p.id}')" title="生成报告(可打印/存 PDF)">${IC.print}</button>
      <button class="icon-btn" onclick="closeProp()" title="关闭">${IC.x}</button>
    </div>

    <h2 class="sec">${IC.home} 基本信息</h2>
    ${p.srcUrl && !p.listPrice ? `<div class="callout warn" style="margin-bottom:12px"><span>${IC.alert}</span><div><b>数据待充填</b>:链接仅建立档案,尚无价格与历史。充填方式:① 书签充填器(「数据」页安装,在房源页点击);② 下方「粘贴解析」;③ 服务端 / AI 充填。完成后点右上打印机图标生成报告。</div></div>`:''}
    <div class="card">
      <div class="row">
        <div class="field" style="flex:2"><label class="f">房源名称</label><input type="text" value="${esc(p.name)}" data-f="name"></div>
        <div class="field" style="flex:2"><label class="f">地址 / 概要</label><input type="text" value="${esc(p.addr)}" placeholder="城市 · 卧室数 · 面积" data-f="addr"></div>
      </div>
      <div class="row">
        <div class="field" style="flex:1 1 150px"><label class="f">持有计划(年)· 决定目标函数</label>
          <input type="number" inputmode="decimal" min="0.5" step="0.5" value="${p.holdYears??''}" placeholder="如 3 或 4" data-f="holdYears"></div>
        <div class="field" style="flex:2 1 240px"><label class="f">快速设定 ${p.holdYears!=null?`· 当前:${holdType(p.holdYears)} ${fmtHold(p.holdYears)}`:''}</label>
          <div class="seg">
            ${[3,4,5,10,30].map(n=>`<button type="button" class="${p.holdYears===n?'on':''}" onclick="setHold('${p.id}',${n})">${n}年</button>`).join('')}
          </div></div>
      </div>
      <div class="row">
        <div class="field"><label class="f">当前挂牌价 $</label><input type="number" inputmode="decimal" value="${p.listPrice??''}" data-f="listPrice"></div>
        <div class="field"><label class="f">HOA $/月</label><input type="number" inputmode="decimal" value="${p.hoaMonthly??''}" data-f="hoaMonthly"></div>
        <div class="field"><label class="f">地税 $/年</label><input type="number" inputmode="decimal" value="${p.taxAnnual??''}" data-f="taxAnnual"></div>
      </div>
      <div class="row">
        <div class="field"><label class="f">保险 $/月</label><input type="number" inputmode="decimal" value="${p.insMonthly??''}" data-f="insMonthly"></div>
        <div class="field"><label class="f">PMI $/月</label><input type="number" inputmode="decimal" value="${p.pmiMonthly??0}" data-f="pmiMonthly"></div>
        <div class="field" style="flex:2 1 200px"><label class="f">来源链接(Redfin / Zillow)</label><input type="url" value="${esc(p.srcUrl||'')}" placeholder="https://…" data-f="srcUrl"></div>
      </div>
      ${m.relist?`<div class="callout warn"><span>${IC.alert}</span><div>检测到多轮挂牌:首挂 ${m.firstDate} 至今 <b>${m.dom} 天</b>,当前轮次 ${m.roundDom} 天。"新上市两周"可能掩盖真实的长期在售——这是重要议价依据,但需 MLS 完整记录正式确认。</div></div>`:''}
    </div>

    <details class="card" style="padding:12px 16px;margin-top:12px" ${(!p.listPrice && p.srcUrl)?'open':''}>
      <summary style="cursor:pointer;font-weight:650;font-size:13px;user-select:none">${!p.listPrice?'数据充填:粘贴解析 / 服务端 / AI':'从挂牌页粘贴 · 自动填表'}</summary>
      <div class="note" style="margin-top:6px">方式一:打开 <a href="${esc(p.srcUrl||'')}" target="_blank" rel="noopener" style="color:var(--brand)">来源页↗</a>,复制页面文字后粘贴解析;方式二:「服务端充填」(需部署并配置数据源);方式三:「AI 充填」复制提示词发给 AI 助手,返回 JSON 在「数据」页导入。</div>
      <textarea id="pasteBox" rows="5" class="mt" placeholder="把 Redfin / Zillow 房源页整页文字粘贴到这里…"></textarea>
      <div class="mt flex">
        <button class="btn soft mini" onclick="pasteParse('${p.id}')">${IC.check} 解析并填入</button>
        <button class="btn ghost mini" onclick="serverFill('${p.id}')">${IC.down} 服务端充填</button>
        <button class="btn ghost mini" onclick="copyAIPrompt('${p.id}')">${IC.star} 让 AI 充填(复制提示词)</button>
        <span class="muted">只填空白字段</span>
      </div>
    </details>

    <h2 class="sec">${IC.trend} 挂牌历史 <span class="n">议价证据的核心</span></h2>
    <div class="card">
      ${p.history.filter(h=>h.price).length>=2?`<div class="mb">${spark(p.history,680,110,'d'+id)}</div>`:''}
      <table class="t"><thead><tr><th>日期</th><th>事件</th><th class="num">价格</th><th></th></tr></thead>
      <tbody>${histRows||'<tr><td colspan="4" class="muted" style="padding:14px 8px">尚无记录 —— 从第一轮挂牌价开始录入</td></tr>'}</tbody></table>
      <div class="mt flex">
        <button class="btn soft mini" onclick="addRow('${p.id}','history')">${IC.plus} 添加记录</button>
        ${m.firstPrice&&p.listPrice?`<span class="muted num">累计降幅 <b style="color:var(--warn)">${pct1(-m.totalCutsPct)}</b>(首挂 ${usd(m.firstPrice)} → 当前 ${usd(p.listPrice)},跨 ${m.dom} 天)</span>`:''}
      </div>
      <datalist id="evlist"><option>挂牌</option><option>降价</option><option>撤牌</option><option>重新挂牌</option><option>上一次成交</option><option>成交</option><option>签约后退出</option></datalist>
    </div>

    <h2 class="sec">${IC.chev} 谈判阶梯 <span class="n">内部使用 · 勿透露给卖方</span></h2>
    <div class="card">
      <table class="t"><thead><tr><th>档位</th><th class="num">合同价</th><th class="num">Credit %</th><th class="num">Credit $</th><th class="num">卖方到手*</th><th class="num">总让步</th><th></th></tr></thead>
      <tbody>${tierRows||'<tr><td colspan="7" class="muted" style="padding:14px 8px">尚无档位</td></tr>'}</tbody></table>
      <div class="mt flex"><button class="btn soft mini" onclick="addRow('${p.id}','tiers')">${IC.plus} 添加档位</button></div>
      <div class="note">*卖方到手 = 合同价 − credit,尚未扣除佣金、贷款偿还及其他卖方费用。卖方把降价和 credit <b>合并计算总让步</b>,所以比较总让步%,而不是单看价格。首行(高亮)为起报价:偏强硬、试探卖方反应,约 8–10% 总让步 + 3% credit 是常见起点。${holdHint(p)}</div>
    </div>

    <h2 class="sec">${IC.home} 参考成交 Comps</h2>
    <div class="card">
      <table class="t"><thead><tr><th>地址</th><th class="num">成交价</th><th>时间</th><th class="num">卧</th><th class="num">sqft</th><th class="num">$/sqft</th><th>备注</th><th></th></tr></thead>
      <tbody>${compRows||'<tr><td colspan="8" class="muted" style="padding:14px 8px">尚无记录</td></tr>'}</tbody></table>
      <div class="mt"><button class="btn soft mini" onclick="addRow('${p.id}','comps')">${IC.plus} 添加参考</button></div>
      <div class="note">同项目/同类型/同期的成交最有分量;跨街区参考需先调整位置、施工质量、布局与补贴差异,不能直接取平均当估值。</div>
    </div>

    <h2 class="sec">${IC.gauge} 房价支撑分析 <span class="n">七维评分 · 决定你该持有多久</span>
      <span style="flex:1"></span><button class="btn ghost mini" onclick="aiAnnotate('${p.id}')" title="用你自己的 AI 填充证据与建议(在数据页配置)">${IC.star} AI 批注</button></h2>
    <div class="card">
      ${FACTORS.map((F,i)=>{
        const f = (p.factors||[])[i]||{s:0,note:''};
        return `<div style="padding:10px 0;border-bottom:1px dashed var(--line)">
          <div class="flex" style="justify-content:space-between;flex-wrap:wrap;gap:6px">
            <div style="min-width:180px;flex:1"><b style="font-size:13px">${F[1]}</b><div class="muted" style="font-size:11.5px">${F[2]}</div></div>
            <div class="flex" style="gap:4px;flex-wrap:nowrap">
              ${[-2,-1,0,1,2].map(v=>`<button type="button" class="fbtn ${f.s===v?'on ':''}${v===-2?'vm2':v===-1?'vm1':v===1?'v1':v===2?'v2':'v0'}" onclick="setFactor('${p.id}',${i},${v})" title="${v===-2?'严重拖累':v===-1?'略拖累':v===0?'中性':v===1?'略支撑':'强支撑'}">${v>0?'+'+v:v}</button>`).join('')}
            </div>
          </div>
          <input style="margin-top:7px;font-size:12px" placeholder="证据 / 数据(会写进报告)" value="${esc(f.note||'')}" data-x="factors.${i}.note">
        </div>`;
      }).join('')}
      ${(()=>{ const fi=factorInfo(p); return `<div class="kvrow mt"><span>综合支撑指数</span><b>${fi.sum>0?'+':''}${fi.sum} / +14 <span class="pill ${fi.band[1]}">${fi.band[0]}</span></b></div>
        <div class="callout info"><span>${IC.target}</span><div>${fi.advice}</div></div>`; })()}
      <div class="note">七维评分用于持有年限决策:供需/需求信号弱 → 短期退出风险高,需压价对冲或延长持有;学区/位置强 → 支撑扎实。报告页自动生成退出情景测算。</div>
    </div>

    <h2 class="sec">${IC.check.replace('stroke-width="3"','stroke-width="2.4"')} 尽调清单 <span class="n">已完成 ${done}/${CHECKLIST.length} · 点击条目切换:待办 → ✓ 确认 → ⚠ 有问题</span></h2>
    <div class="card">${checkItems}</div>

    <h2 class="sec">${IC.restore.replace('M3 12a9','M3 12a9')} 备注</h2>
    <div class="card">
      <textarea rows="7" placeholder="疑点、卖方动机、实地看房记录、经纪人的回答……" data-f="notes">${esc(p.notes||'')}</textarea>
      <div class="note">💡 在「计算器」页绑定这套房,可直接用这里的阶梯与费率算 buydown 月供。</div>
    </div>`;
  bindSheet(p);

/* 服务端充填:调用部署版的 /api/property(持牌数据 API),静态/本地环境自动降级 */
async function serverFill(id, silent){
  const p = getProp(id); if(!p) return;
  if(!silent) toast('服务端充填中…');
  try{
    const q = p.srcUrl ? 'url='+encodeURIComponent(p.srcUrl) : 'address='+encodeURIComponent(p.addr||p.name);
    const ctrl = new AbortController();
    const to = setTimeout(()=>ctrl.abort(), 9000);
    const r = await fetch('api/property?'+q, { signal: ctrl.signal });
    clearTimeout(to);
    const j = await r.json().catch(()=>({ ok:false, message:'响应解析失败' }));
    if(!j.ok) throw new Error(j.message || ('HTTP '+r.status));
    const d = j.data, filled=[];
    if(!p.listPrice && d.listPrice){ p.listPrice = d.listPrice; filled.push('挂牌价'); }
    const sum = [d.beds?d.beds+'卧':null, d.sqft?d.sqft.toLocaleString('en-US')+' sqft':null, d.yearBuilt?'建于'+d.yearBuilt:null].filter(Boolean).join(' · ');
    if(sum && !/sqft/.test(p.addr||'')){ p.addr = (p.addr||'')+' · '+sum; filled.push('概要'); }
    if((!p.history||!p.history.length) && d.history && d.history.length){ p.history = d.history; filled.push('成交历史'); }
    if(d.dom) p.notes = (p.notes?p.notes+'\n':'') + '服务端('+d.source+'):在售 '+d.dom+' 天';
    if(!filled.length) throw new Error('数据源中无更多可填字段');
    save(); renderSheet(id);
    toast('服务端充填:'+filled.join(' / '));
    maybeAutoAnnotate(id).then(ok=>{ if(ok) renderSheet(id); }).catch(()=>{});
  }catch(e){
    if(!silent) toast('服务端充填不可用 —— '+(e.message||''), false);
  }
}

/* 挂牌页文本解析(纯函数):书签充填器与粘贴解析共用 */
function extractFromText(txt){
  const out = {listPrice:null,beds:null,baths:null,sqft:null,hoa:null,tax:null,built:null,url:null,history:[]};
  if(!txt) return out;
  const money = [...txt.matchAll(/\$\s?([\d,]+(?:\.\d+)?)/g)].map(x=>parseFloat(x[1].replace(/,/g,'')));
  out.listPrice = money.find(v=>v>=50000) ?? null;
  const grab = re => { const m = txt.match(re); return m ? parseFloat(m[1].replace(/,/g,'')) : null; };
  out.beds  = grab(/(\d+)\s*(?:bd\b|bed|卧)/i);
  out.baths = grab(/(\d+(?:\.\d+)?)\s*(?:ba\b|bath|卫)/i);
  out.sqft  = grab(/([\d,]{3,})\s*(?:sqft|sq\.?\s?ft|平方)/i);
  out.hoa   = grab(/HOA[^\d\n]{0,24}\$?\s?([\d,]+)/i) || grab(/\$\s?([\d,]{2,6})\s*\/?\s*mo\s*HOA/i);
  out.tax   = grab(/(?:地税|property tax|annual tax|taxes)[^\d\n]{0,24}\$?\s?([\d,]{3,})/i);
  if(out.tax!=null && out.tax<=500) out.tax=null;
  out.built = grab(/(?:year built|built in|建于)[^\d\n]{0,12}(\d{4})/i);
  out.url   = (txt.match(/https?:\/\/[^\s]*(?:zillow|redfin|realtor)[^\s]*/i)||[])[0] || null;
  // 价格历史行:"5/27/2026 Listed for sale $995,000" 或 Redfin "September 8, 2026 · Price Change · $849,000"
  const re = /(\d{1,2}\/\d{1,2}\/\d{4})[ \t]+([A-Za-z][A-Za-z \-]{2,28})[ \t]+\$([\d,]{5,})/g;
  let mm, seen=new Set();
  while((mm = re.exec(txt)) && out.history.length<12){
    const [, d, ev, pr] = mm;
    if(!/listed|price|sold|pending|removed|contingent|relisted/i.test(ev)) continue;
    const p = parseInt(pr.replace(/,/g,''));
    const key = d+'|'+p;
    if(seen.has(key)) continue; seen.add(key);
    const [M,D,Y] = d.split('/');
    out.history.push({date:`${Y}-${M.padStart(2,'0')}-${D.padStart(2,'0')}`, label: ev.replace(/price change/i,'降价').replace(/listed for sale/i,'挂牌').replace(/listed for rent/i,'挂牌出租').replace(/sold/i,'成交').replace(/removed/i,'撤牌').replace(/pending|contingent/i,'待过户').trim(), price:p});
  }
  return out;
}

function applyExtract(p, ex){

  if(summary && !/sqft/.test(p.addr||'')){ p.addr = (p.addr? p.addr.replace(/\s*·\s*(\d+卧|\d+,\d+ sqft).*$/,'')+' · ':'') + summary; filled.push('概要'); }

/* Credit ↔ Buydown 调平引擎:有缺口给三方案+推荐,有结余给用法建议 */
function creditPlanHtml(s, r, loan, escM){
  if(s.creditAmt==null || s.creditAmt<=0 || !s.price) return '';
  const NAMES={'none':'固定利率','2-1':'2-1 buydown','3-2-1':'3-2-1 buydown'};
  const offs={'none':0,'2-1':2,'3-2-1':3}[s.buydown]||0;
  const gap = r.fund - s.creditAmt;
  const h = s.hold, cap = s.creditCap??6;

  if(gap<=0){ // 结余:主动给出用法优先级
    const remain = -gap;
    let extra='';
    if(s.buydown==='none'){
      const f21 = buydownSchedule(loan, s.rate, s.term, '2-1').fund;
      extra = ` 想压月供:同额 credit 改做 2-1 需资金 ${usd(f21)}${f21<=s.creditAmt?'(可覆盖)':''};短期持有者尤其值得。`;
    } else if(remain>0){
      extra = ` 结余用法:短期持有 → 留在 credit 付过户费/预付款;长期持有 → 和卖方谈成降价更值(每 $1 降价 ≈ 30 年利息 $1.4,credit 只值 $1)。`;
    }
    const noFund = ' 可全部用于合格成交费用(过户费、预付税款保险、临时 buydown 等)。';
    return `<div class="callout info"><span>${IC.check}</span><div>Credit ${usd(s.creditAmt)}${r.fund?` 扣除 buydown 资金 ${usd(r.fund)} 后,还剩 <b>${usd(remain)}</b> 可用于其他合格成交费用(过户费、预付税款保险等)。`:noFund}${extra}</div></div>`;
  }

  // 缺口 gap>0:三个调平方案
  const P=s.price, d=s.downPct/100, rate=s.rate, term=s.term;
  const lower={'3-2-1':'2-1','2-1':'none','none':'none'}[s.buydown];
  // A 降档
  const rA = buydownSchedule(P*(1-d), rate, term, lower);
  const offsA={'none':0,'2-1':2,'3-2-1':3}[lower]||0;
  const coveredA = h!=null && h<=offsA;
  // B 价格↔credit 平移(卖方到手不变)
  const P2=P+gap, C2=r.fund, pctB=C2/P2*100;
  const rB = buydownSchedule(P2*(1-d), rate, term, s.buydown);
  const capOK = pctB<=cap;
  const coveredB = h!=null && h<=offs && offs>0;

  let rec=null, why;
  if(h==null){ why='设定持有年限后,这里会标出推荐方案。'; }
  else if(h<=offs && offs>0){
    if(capOK){ rec='B'; why=`推荐 B:持有 ${fmtHold(h)} 全周期覆盖,卖方到手不变(${usd(P-s.creditAmt)}),你不用额外掏现金。注意两点:合同价抬高会略增卖方佣金、并需评估价配合。`; }
    else { rec='C'; why=`平移后 credit 需 ${pctB.toFixed(2)}%,超过上限 ${cap}% → 推荐 C:自掏 ${usd(gap)} 保全覆盖;若现金流紧张,退而求其次选 A。`; }
  } else if(offs>0){ rec='A'; why=`持有 ${fmtHold(h)} 超出补贴年数(${offs} 年),买断仅覆盖前 ${offs} 年 → 推荐 A 降档,让步转用于降价或过户费。`; }
  else { why='当前为固定利率,无 buydown 资金需求。'; }

  const row=(tag,name,o)=>`<tr ${rec===tag?'style="background:var(--brand-soft)"':''}>
    <td>${rec===tag?`<span class="pill deal">${IC.star.replace('stroke-width="1.8"','stroke-width="2.2"')} 推荐</span> `:''}<b>${name}</b><div class="muted" style="font-weight:400">${o.sub}</div></td>
    <td class="num">${usd(o.price)}</td>
    <td class="num">${usd(o.credit)}<div class="muted">${o.pct!=null?o.pct.toFixed(2)+'%':''}</div></td>
    <td class="num">${o.y1!=null?usd(o.y1):'—'}</td>
    <td style="font-size:12px">${o.note}</td></tr>`;

  const rows =
    row('A', lower==='none'?'取消买断':'降为 '+NAMES[lower], {sub:'方案 A · 降档', price:P, credit:s.creditAmt, pct:s.creditAmt/P*100,
      y1: rA.years[0]?.pi,
      note: `资金 ${usd(rA.fund)}${rA.fund>0&&rA.fund<s.creditAmt?`,credit 覆盖后剩 ${usd(s.creditAmt-rA.fund)}`:''}${lower==='none'?'':';'}${h==null?'':(coveredA?'<br><span style="color:var(--ok);font-weight:650">✓ 仍全覆盖</span>':`<br>第 ${offsA+1} 年起月供 ${usd(rA.base)}`)}`}) +
    row('B','价格换 Credit 平移',{sub:'方案 B · 卖方到手不变', price:P2, credit:C2, pct:pctB, y1:rB.years[0]?.pi,
      note: `缺口 ${usd(gap)} 从价格转入 credit,卖方到手维持 ${usd(P-s.creditAmt)}${capOK?'':`<br><span style="color:var(--danger);font-weight:650">⚠ credit ${pctB.toFixed(2)}% 超上限 ${cap}%</span>`};本金增加 ${usd(gap*(1-d))}`}) +
    row('C','自掏补足缺口',{sub:'方案 C · 现金前置', price:P, credit:s.creditAmt, pct:s.creditAmt/P*100, y1:r.years[0]?.pi,
      note: `自己向补贴账户注入 ${usd(gap)};持有期月供减免 = 投入(名义打平、时点前置),换来的是现金流平滑`});

  return `<div class="callout warn"><span>${IC.scale}</span><div>Buydown 需 <b>${usd(r.fund)}</b>,Credit ${usd(s.creditAmt)} 缺口 <b>${usd(gap)}</b> —— 调平方案对比:</div></div>
    <table class="t mt"><thead><tr><th>调平方案</th><th class="num">合同价</th><th class="num">Credit</th><th class="num">首年本息</th><th>效果与代价</th></tr></thead><tbody>${rows}</tbody></table>
    ${why?`<div class="callout ${rec?'info':'warn'}"><span>${rec?IC.star:IC.alert}</span><div>${why}</div></div>`:''}
    <div class="note">方案 B 中卖方到手净额不变;合同价抬高会增加佣金基数并需评估价支持,贷款本金相应增加。Credit 上限 ${cap}% 可在上方修改(常规贷款约 3–6%,以贷款机构为准)。</div>`;
}

function holdTotals(loan, rate, term, holdYears){
  const months = Math.round(holdYears*12);
  const base = pmt(loan, rate, term);
  const schemes = [['none',[]],['2-1',[2,1]],['3-2-1',[3,2,1]]];
  return schemes.map(([name,offs])=>{
    let sum=0, fund=0;
    for(let m=0;m<months;m++){
      const yr=Math.floor(m/12)+1;
      const off=offs[yr-1]||0;
      const pay = off>0 ? pmt(loan, Math.max(0.0001, rate-off), term) : base;
      sum+=pay; if(off>0) fund+=base-pay;
    }
    return {name, sum, fund, covered: name!=='none' && months<=offs.length*12, beyond: Math.max(0, holdYears-offs.length)};
  });
}
/* 按持有期输出:护栏结论 + 方案对比 + 让步偏好 */
function holdBlockHtml(loan, s, escM, r){
  const h=s.hold;
  if(h==null) return `<div class="callout info"><span>${IC.target}</span><div><b>先设定持有年限</b>——它决定目标函数:补贴是否覆盖全持有期、各方案持有期本息对比、降价与 credit 的偏好,都会随之改变。</div></div>`;
  const offs={'none':0,'2-1':2,'3-2-1':3}[s.buydown]||0;
  const baseAll=r.base+escM;
  let guard;
  if(offs>0 && h<=offs){
    guard=`<div class="callout info"><span>${IC.check}</span><div><b>补贴覆盖整个持有期</b>(持有 ${fmtHold(h)} ≤ 补贴 ${offs} 年):票面利率全包月供 <b class="num">${usd(baseAll)}</b> 在计划持有期内<b>不会实际发生</b>。<br>兜底核对:若到期无法出售或再融资不成立,月供将回到上述水平;需确认该情形可承受或再融资路径可行。</div></div>`;
  } else if(offs>0){
    const yr=r.years.find(y=>y.year===offs+1)||r.years[r.years.length-1];
    guard=`<div class="callout warn"><span>${IC.alert}</span><div><b>持有期超出补贴</b>(持有 ${fmtHold(h)} > 补贴 ${offs} 年):第 ${offs+1} 年起全包月供 <b class="num">${usd(yr.pi+escM)}</b>,这部分必须长期可负担。</div></div>`;
  } else {
    guard=`<div class="callout info"><span>${IC.clock}</span><div>无 buydown:全期全包月供 <b class="num">${usd(baseAll)}</b>。若为短期持有,评估用 credit 换 2-1 / 3-2-1 的现金流价值(见下表)。</div></div>`;
  }
  const NAMES={'none':'固定利率','2-1':'2-1 buydown','3-2-1':'3-2-1 buydown'};
  const tots=holdTotals(loan, s.rate, s.term, h);
  const rows=tots.map(t=>{
    const cur=t.name===s.buydown;
    const cover = t.name==='none' ? '—' : (t.covered?'<span style="color:var(--ok);font-weight:650">✓ 全覆盖</span>':`超出补贴 ${fmtHold(t.beyond)}`);
    const save = t.name==='none' ? '基准' : (tots[0].sum-t.sum>0 ? '<span style="color:var(--ok);font-weight:650">省 '+usd(tots[0].sum-t.sum)+'</span>' : '+ '+usd(t.sum-tots[0].sum));
    return `<tr ${cur?'style="background:var(--brand-soft)"':''}><td>${NAMES[t.name]}${cur?' <span class="pill offer">当前</span>':''}</td><td class="num">${usd(t.sum)}</td><td class="num">${t.fund?usd(t.fund):'—'}</td><td>${cover}</td><td class="num">${save}</td></tr>`;
  }).join('');
  const pref = h<=5
    ? `短期持有(${fmtHold(h)}):等额让步优先转换为 credit/buydown —— 每 $1 转换为持有期月供减免约 $1,转为降价 3 年仅减约 $0.24(降价价值体现在退出净值)。`
    : `长期持有(${fmtHold(h)}):等额让步优先转换为降价 —— 每 $1 降价约减少 30 年利息 $1.4(7% 量级);credit 仅等于头几年的 $1。`;
  return `${guard}
    <table class="t mt"><thead><tr><th>持有 ${fmtHold(h)} 方案对比</th><th class="num">本息合计</th><th class="num">需补贴资金</th><th>覆盖情况</th><th class="num">vs 固定</th></tr></thead>
    <tbody>${rows}</tbody></table>
    <div class="note">本息合计 = 持有期内全部月供之和(不含税/保险/HOA,三方案这部分相同)。${pref}</div>`;
}

function bindCalc(){
  const s = calcState;
  $('#c-prop').addEventListener('change', e=>{
    s.propId = e.target.value;
    const p = getProp(s.propId);
    if(p){
      s.price = p.tiers?.[0]?.price || p.listPrice; s.downPct = p.downPct??10; s.rate = p.rate??7.12; s.term = p.term??30;
      s.taxAnnual = p.taxAnnual; s.hoaMonthly = p.hoaMonthly; s.insMonthly = p.insMonthly??100; s.pmiMonthly = p.pmiMonthly??0;
      if(p.holdYears!=null) s.hold = p.holdYears;
      const t = p.tiers?.[0]; if(t?.price) s.creditAmt = Math.round(concession(p.listPrice||t.price, t.price, t.creditPct).credit);
    }
    renderCalc();
  });
  const map = {'#c-price':'price','#c-down':'downPct','#c-rate':'rate','#c-tax':'taxAnnual','#c-hoa':'hoaMonthly','#c-ins':'insMonthly','#c-pmi':'pmiMonthly','#c-credit':'creditAmt','#c-cap':'creditCap','#q-list':'qList','#q-offer':'qOffer','#q-creditpct':'qCreditPct'};
  Object.entries(map).forEach(([sel,key])=>{
    $(sel).addEventListener('input', e=>{ s[key] = e.target.value===''?null:parseFloat(e.target.value); renderCalc(); });
  });
  $('#c-term').addEventListener('change', e=>{ s.term = parseInt(e.target.value); renderCalc(); });
  $('#c-hold').addEventListener('input', e=>{ s.hold = e.target.value===''?null:parseFloat(e.target.value); renderCalc(); });
  $$('#c-bd button').forEach(b=>b.addEventListener('click',()=>{ s.buydown = b.dataset.v; renderCalc(); }));
  $$('#holdSegC button').forEach(b=>b.addEventListener('click',()=>{ s.hold = parseFloat(b.dataset.v); renderCalc(); }));
}

function saveAi(){

async function testAI(){
  if(aiCfg.provider){ if(saveAi()===false) return; }
  else{
    const ok = await detectLocalAI(false);
    if(!ok && hasChromeAI()){ aiCfg.provider='chrome'; saveAiCfg(); renderData(); return; }
    if(!ok){ toast('未检测到可用 AI —— 选择引擎并填入 key,或在本机装 Ollama', false); return; }
  }
  let chain = [aiCfg.provider];
  const t0=Date.now();
  try{
    const txt=await callAI(' connectivity test. Reply with exactly this JSON and nothing else: {"ok":true}', 'ping', chain[0], 25000);
    const a=parseAIJson(txt);
    toast(a? '连接成功 · '+provById(chain[0]).name+' ('+(Date.now()-t0)+'ms)' : (String(txt).trim()? '已连通 · '+provById(chain[0]).name+' ('+(Date.now()-t0)+'ms) — 输出非 JSON,分析功能仍可用' : '已连通但返回为空 —— 建议检查模型名', true));
  }catch(e){
    const m=String(e.message||''); let hint='';
    if(/Failed to fetch|Load failed|NetworkError|TypeError/i.test(m)){
      hint = /localhost|127\.0\.0\.1/i.test(aiBase())
        ? ' —— 浏览器阻止 https→本机:用 Chrome 打开,或在本地运行本应用;Chrome 下需 OLLAMA_ORIGINS 放行并重启 Ollama'
        : ' —— 已自动尝试服务器中转仍失败:检查网络/密钥';
    }
    else if(/HTTP 401|HTTP 403/i.test(m)) hint=' —— 密钥无效或无权限';
    else if(/HTTP 404/i.test(m)) hint=' —— 端点或模型名不正确';
    else if(/abort|time/i.test(m)) hint=' —— 超时(网络慢或端点不可达)';
    toast('连接失败 —— '+m.slice(0,80)+hint, false);
  }
}
function exportDb(){
  const blob = new Blob([JSON.stringify(db,null,2)],{type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `home-deal-coach-${todayStr()}.json`; a.click(); URL.revokeObjectURL(a.href);
}
function importDb(input){
  const f = input.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const d = JSON.parse(r.result);
      if(!Array.isArray(d.properties)) throw 0;
      if(confirm(`导入 ${d.properties.length} 套房源,覆盖当前全部数据?`)){ db = d; save(); }
    }catch(e){ toast('文件格式不正确,导入失败', false); }
  };
  r.readAsText(f);
}
function restoreSeed(){
  const seed = seedDb();
  let added = 0;
  seed.properties.forEach((p,i)=>{
    if(db.properties.some(x=>x.seed&&x.name===p.name)) return;
    p.id = p.id+'-'+Date.now()+i; db.properties.push(p); added++;
  });
  save();
}
function wipe(){
  if(!confirm('清空全部房源数据?建议先导出备份。')) return;
  db = {properties:[]}; save();
}

  const app = /^https?:$/.test(location.protocol) ? location.origin + location.pathname : 'https://home-deal-coach.vercel.app/';
  const code = `(function(){try{var t=document.body.innerText;var p={srcUrl:location.href,title:document.title,raw:t.slice(0,24000)};var s=btoa(unescape(encodeURIComponent(JSON.stringify(p))));var u=${JSON.stringify(app)}+'#hdc='+encodeURIComponent(s);var w=window.open(u,'_blank');if(!w)location.href=u;}catch(e){alert('extract failed:'+e.message)}})()`;
  return 'javascript:' + encodeURIComponent(code);
}

async function callAI(sys, user, pid, timeoutMs){
  const pr = provById(pid || aiCfg.provider);
  if(!pr) throw new Error('未选择 AI 引擎');
  const key = (aiCfg.keys&&aiCfg.keys[pr.id]) || '';
  let base = ((aiCfg.baseOverride!=null&&aiCfg.baseOverride!=='')&&pr.id===aiCfg.provider?aiCfg.baseOverride:pr.base).replace(/\/+$/,'');
  if(pr.id==='ollama') base = base.replace('localhost','127.0.0.1');
  const model = (aiCfg.models&&aiCfg.models[pr.id]) || (pr.models&&pr.models[0]) || '';
  const ctrl=new AbortController(); const to=setTimeout(()=>ctrl.abort(), timeoutMs||60000);
  try{
    if(pr.kind==='chrome'){
      const LM=chromeLM(); if(!LM) throw new Error('此浏览器不支持内置 AI');
      const av=await LM.availability();
      if(av!=='available') throw new Error(av==='downloadable'?'内置模型待下载:「数据」页一键启用':'内置 AI 不可用('+av+')');
      const sess=await LM.create({initialPrompts:[{role:'system',content:sys}],temperature:0.3});
      const out=await sess.prompt(user); try{sess.destroy&&sess.destroy();}catch(e){}
      return out;
    }
    if(pr.kind==='anthropic'){
      try{
        const r=await fetch(base+'/messages',{method:'POST',signal:ctrl.signal,headers:{'Content-Type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({model,max_tokens:1600,temperature:0.3,system:sys,messages:[{role:'user',content:user}]})});
        if(!r.ok) throw new Error('HTTP '+r.status+' '+(await r.text()).slice(0,100));
        const j=await r.json(); return (j.content||[]).map(c=>c.text||'').join('');
      }catch(e){
        if(!(/^https:/.test(location.protocol)) || !((e instanceof TypeError) || /Failed to fetch|Load failed|NetworkError/i.test(e.message||''))) throw e;
        return await relayAI({kind:'anthropic', base, model, key, system:sys, user});
      }
    }
    if(pr.kind==='gemini'){
      try{
        const r=await fetch(base+'/models/'+encodeURIComponent(model)+':generateContent?key='+encodeURIComponent(key),{method:'POST',signal:ctrl.signal,headers:{'Content-Type':'application/json'},body:JSON.stringify({systemInstruction:{parts:[{text:sys}]},contents:[{role:'user',parts:[{text:user}]}],generationConfig:{temperature:0.3}})});
        if(!r.ok) throw new Error('HTTP '+r.status+' '+(await r.text()).slice(0,100));
        const j=await r.json(); return (((j.candidates||[])[0]||{}).content?.parts||[]).map(p=>p.text||'').join('');
      }catch(e){
        if(!(/^https:/.test(location.protocol)) || !((e instanceof TypeError) || /Failed to fetch|Load failed|NetworkError/i.test(e.message||''))) throw e;
        return await relayAI({kind:'gemini', base, model, key, system:sys, user});
      }
    }
    try{
      const r=await fetch(base+'/chat/completions',{method:'POST',signal:ctrl.signal,headers:{'Content-Type':'application/json',...(key?{Authorization:'Bearer '+key}:{})},body:JSON.stringify({model:model||'gpt-4o-mini',temperature:0.3,messages:[{role:'system',content:sys},{role:'user',content:user}]})});
      if(!r.ok) throw new Error('HTTP '+r.status+' '+(await r.text()).slice(0,100));
      const j=await r.json(); return j.choices?.[0]?.message?.content||'';
    }catch(e){
      if(!/^https:/.test(location.protocol)) throw e;
      const netErr = (e instanceof TypeError) || /Failed to fetch|Load failed|NetworkError/i.test(e.message||'');
      if(!netErr) throw e;
      return await relayAI({kind:pr.kind, base, model, key, system:sys, user});
    }
  } finally { clearTimeout(to); }
}

async function relayAI(payload){
  const r=await fetch('api/ai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
  const j=await r.json().catch(()=>null);
  if(j && j.ok) return j.text;
  throw new Error((j&&j.message) || '直连失败,且服务器中转不可用(需部署版;本地使用请用本机引擎)');
}
function parseAIJson(txt){
  try{

    const a=s.indexOf('{'), b=s.lastIndexOf('}');
    if(a<0||b<=a) return null;
    return JSON.parse(s.slice(a,b+1));
  }catch(e){ return null; }
}
